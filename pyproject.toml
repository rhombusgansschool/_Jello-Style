[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jello-style"
version = "0.1.0"
description = "The Project Jello look - one dark palette for PySide6 (Qt) and Tkinter apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # palette + Tk side are stdlib only

[project.optional-dependencies]
qt = ["PySide6>=6.6"]      # pip install "jello-style[qt] @ git+..."

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jello_style = ["py.typed"]
